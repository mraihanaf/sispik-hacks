%% Order is significant. Browser credentials are never allowed to publish.
{allow, {username, "dashboard"}, subscribe, ["sispik/v1/realtime/#"]}.
{deny, {username, "dashboard"}, publish, ["#"]}.

%% The dashboard backend only projects normalized operational events.
{allow, {username, "dashboard-server"}, publish, ["sispik/v1/realtime/#"]}.
{deny, {username, "dashboard-server"}, subscribe, ["#"]}.

%% Subscription filters use exact matching so the broker permits the four
%% wildcard filters the ingestor actually sends, without expanding access.
{allow, {username, "iot-ingestor"}, subscribe, [
  {eq, "sispik/v1/ingest/sites/+/telemetry"},
  {eq, "sispik/v1/ingest/vehicles/+/telemetry"},
  {eq, "sispik/v1/ingest/vehicles/+/rfid"},
  {eq, "sispik/v1/ingest/devices/+/status"}
]}.
{deny, {username, "iot-ingestor"}, all, ["#"]}.

%% Development simulator is constrained to the two documented simulator devices.
{allow, {username, "sispik-simulator"}, publish, ["sispik/v1/ingest/sites/SENSOR-TPS-001/telemetry", "sispik/v1/ingest/vehicles/TRACKER-TRK-001/telemetry", "sispik/v1/ingest/vehicles/TRACKER-TRK-001/rfid", "sispik/v1/ingest/devices/SENSOR-TPS-001/status", "sispik/v1/ingest/devices/TRACKER-TRK-001/status"]}.
{deny, {username, "sispik-simulator"}, all, ["#"]}.

%% Devices may publish only their own topic namespace; their JWT subject and
%% MQTT username are provisioned as the device ID.
{allow, all, publish, ["sispik/v1/ingest/sites/${username}/telemetry", "sispik/v1/ingest/vehicles/${username}/telemetry", "sispik/v1/ingest/vehicles/${username}/rfid", "sispik/v1/ingest/devices/${username}/status"]}.
{deny, all}.
